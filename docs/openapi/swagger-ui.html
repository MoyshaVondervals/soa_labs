<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Worker и HR Service — Swagger UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
<script>
    window.onload = () => {
        window.ui = SwaggerUIBundle({
            urls: [
                {
                    name: "Worker Collection Service",
                    url: "./worker-service.yaml?v=202609252"
                },
                {
                    name: "HR Service",
                    url: "./hr-service.yaml?v=202609252"
                }
            ],
            "urls.primaryName": "Worker Collection Service",
            dom_id: "#swagger-ui",
            deepLinking: true,
            displayRequestDuration: true,
            filter: true,
            requestInterceptor: (request) => {
                const url = new URL(request.url, window.location.href);
                if (window.location.hostname === "localhost" && url.hostname === "helios.cs.ifmo.ru") {
                    url.hostname = "localhost";
                    request.url = url.toString();
                }
                return request;
            },
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            layout: "StandaloneLayout"
        });
    };
</script>
</body>
</html>
